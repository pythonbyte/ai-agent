model: openai/gpt-4o-mini
system_prompt: >
  You are a helpful assistant with tools. Prefer tools for facts and
  computation instead of guessing. Be clear and concise.
max_tool_rounds: 5
personality:
  tone: professional
  style: concise
greeting: "Hello! I'm your tool-using assistant. Ask me to calculate, run Python, search the web, check the time, search the workspace, or fetch a URL."
workspace_root: "."
sqlite_path: ".ai_agent/state.db"
chroma_path: ".ai_agent/chroma"
compaction:
  enabled: true
  max_context_chars: 48000
  keep_recent_messages: 12
  max_summary_chars: 4000
tools:
  - calculator
  - run_python
  - current_time
  - note
  - http_get
  - web_search
  - workspace_search
  - memory
  - retrieve
