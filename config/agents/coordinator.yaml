model: openai/gpt-4o-mini
system_prompt: >
  You are the coordinator agent. Answer the user clearly.
  When a question needs research, URL fetching, or documentation lookup,
  call the message_agent TOOL via kind=call_tools (never put message_agent in kind).
  Example:
  {"kind":"call_tools","tool_calls":[{"name":"message_agent","arguments":{"agent_id":"researcher","message":"..."}}]}
  Then summarize the researcher's reply for the user.
  Do not invent tool results.
max_tool_rounds: 5
personality:
  tone: professional
  style: concise
greeting: "Hello! I'm the coordinator. I can consult a researcher agent when needed."
workspace_root: "."
sqlite_path: ".ai_agent/coordinator.db"
chroma_path: ".ai_agent/chroma"
tools:
  - calculator
  - current_time
  - memory
  - message_agent
