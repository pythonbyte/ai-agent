[project]
name = "ai-agent"
version = "0.1.0"
description = "A typed, clean-architecture tool-using conversational agent kit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Eduardo Chiarotti (pythonbyte)" }
]
keywords = ["agent", "llm", "tools", "orchestration", "asyncio"]

dependencies = [
    "aioconsole>=0.8.2",
    "ddgs>=9.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0.0",
    "mutmut>=3.2.0",
]
rag = [
    "chromadb>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/pythonbyte/ai-agent"
Repository = "https://github.com/pythonbyte/ai-agent"
Documentation = "https://github.com/pythonbyte/ai-agent#readme"

[project.scripts]
ai-agent = "ai_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/config",
    "/examples",
    "/docs",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/ai_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["ai_agent"]

[[tool.mypy.overrides]]
module = ["aioconsole", "websockets.*", "chromadb", "ddgs", "ddgs.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["ai_agent"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/ai_agent/application/tool_args.py",
    "src/ai_agent/application/url_safety.py",
    "src/ai_agent/infrastructure/workspace_fs.py",
    "src/ai_agent/application/registry.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "--tb=no"]
# Equivalent / noise mutations (log strings, raise messages) — triage survivors with browse.
do_not_mutate_patterns = [
    'logger\\.\\w+',
    'raise \\w+',
]
